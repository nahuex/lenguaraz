# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  security-events: write

env:
  ENGINE: fake
  PYTHONIOENCODING: utf-8

jobs:
  python:
    name: lint · types · tests · gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Python dependencies
        run: uv sync --frozen --all-groups
      - name: Install frontend dependencies
        run: npm ci --prefix web
      - name: Ruff (lint + format)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: mypy
        run: uv run mypy
      - name: pytest (ENGINE=fake, no network)
        run: uv run pytest -q
      - name: SPDX headers
        run: sh scripts/spdx_check.sh
      - name: Docs check
        run: uv run python scripts/docs_check.py
      - name: License gate (Constitution Art. XVII.B)
        run: uv run python scripts/license_check.py --write
      - name: THIRD_PARTY_LICENSES.md is up to date
        run: git diff --exit-code --ignore-matching-lines='^Generated:' THIRD_PARTY_LICENSES.md

  web:
    name: frontend · lint · tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - run: npm test -- --run
      - run: npm run build

  secrets:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trivy-fs:
    name: trivy filesystem scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln,secret,misconfig

  image:
    name: container image · trivy · SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t lenguaraz:ci .
      - name: Image runs as non-root
        run: |
          user="$(docker inspect --format '{{.Config.User}}' lenguaraz:ci)"
          echo "USER=$user"
          test -n "$user" && test "$user" != "root" && test "$user" != "0"
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: lenguaraz:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: SBOM (SPDX JSON)
        uses: anchore/sbom-action@v0
        with:
          image: lenguaraz:ci
          format: spdx-json
          artifact-name: sbom-lenguaraz.spdx.json
          upload-artifact: true
