# SPDX-License-Identifier: Apache-2.0
# Default stages: the two bundled samples, replayed in a loop so `make demo` never stops.
# Every field is documented in docs/configuration.md. Copy examples/*.yaml for your event.
stages:
  - id: main
    name: "Main Stage"
    source: "samples/en_kubernetes.wav"   # file | http(s) HLS | rtmp:// | srt:// | device
    source_lang: ["en-US"]                # [] = auto-detect (including code-switching)
    targets: ["es", "pt"]
    talk:
      title: "Observability for Kubernetes with eBPF"
      abstract: "Kernel-level tracing without sidecars: Cilium, Pixie, OpenTelemetry and what we measured."
    glossary: ["Kubernetes", "eBPF", "Cilium", "Pixie", "OpenTelemetry", "Prometheus", "Grafana", "CoreDNS", "p99"]
    loop: true
  - id: workshop
    name: "Workshop Room"
    source: "samples/es_asyncio.wav"
    source_lang: ["es-419"]
    targets: ["en", "pt"]
    talk:
      title: "Subtítulos en vivo con Python y asyncio"
      abstract: "Un servicio de transcripción y traducción por escenario, con TaskGroup, backpressure y Gemini Live."
    glossary: ["asyncio", "TaskGroup", "backpressure", "ffmpeg", "WebSocket", "Gemini", "Docker", "Kubernetes", "eBPF", "Nerdearla"]
    loop: true

  # Demo-day stage: a real Nerdearla talk played in the browser, captured by OBS (desktop audio)
  # and streamed here over SRT. Local only, not committed.
  - id: charla
    name: "Nerdearla talk (live from OBS)"
    source: "srt://0.0.0.0:9000?mode=listener&latency=200000"
    source_lang: ["es-419"]
    targets: ["en", "pt"]
    talk:
      title: "Nerdearla talk"
      abstract: "A technical talk from a previous Nerdearla edition, streamed live from the browser through OBS."
    glossary: ["Nerdearla", "Kubernetes", "Docker", "Python", "JavaScript", "TypeScript", "Linux", "API", "DevOps", "Cloud", "AWS", "Google Cloud", "Gemini", "open source"]

